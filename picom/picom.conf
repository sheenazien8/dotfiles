# picom config - transparent + blurred polybar
backend = "glx";
vsync = true;
forked = true;

# Required for ueberzugpp image overlay
unredir_if_possible = false;

# Background blur (dual_kawase, glx backend)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-frame = false;

# Exclude selection overlay (slop) from blur.
# slop draws a fullscreen translucent overlay; without this, picom blurs the
# backdrop behind it, and maim then captures that blurred image -> area
# screenshots come out blurry while fullscreen ones stay sharp.
blur-background-exclude = [
  "class_g = 'slop'",
  "class_i = 'slop'",
  "name = 'slop'"
];
