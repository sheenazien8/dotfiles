[Service]
# The base unit starts kdeconnectd with QT_QPA_PLATFORM=offscreen and no DISPLAY,
# so the daemon has no X access and cannot write the X clipboard when another
# device sends its clipboard (receive shows a notification but paste still
# returns old content). Give it a real X connection instead.
Environment=QT_QPA_PLATFORM=xcb
Environment=DISPLAY=:0
Environment=XAUTHORITY=%h/.Xauthority
